[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abyss"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.8,<2",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "websockets",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["abyss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
