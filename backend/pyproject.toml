[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "abyss"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40,<3",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "websockets",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "mcp>=2.2",
]
# Tools from Slack, Discord, Notion, ... for the working vendors (mcp.json).
mcp = [
    "mcp>=2.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["abyss*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
